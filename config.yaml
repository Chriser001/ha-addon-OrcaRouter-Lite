name: OrcaRouter Lite
version: 0.1.0
slug: orcarouter_lite
description: Self-hosted LLM router with a managed safety net — OpenAI-compatible, BYOK, model="auto". Dashboard + API on port 8000 (LAN only).
url: https://github.com/Chriser001/ha-addon-OrcaRouter-Lite
arch:
  - aarch64
  - amd64
startup: application
boot: auto
watchdog: "http://[HOST]:[PORT:8000]/health"
ports:
  8000/tcp: 8000
map:
  - addon_config:rw
options:
  log_level: info
  credential_encryption_key: ""
  allow_insecure_dev_key: false
  database_url: ""
  router_cooldown_seconds: 60
  openai_api_key: ""
  anthropic_api_key: ""
  google_api_key: ""
  groq_api_key: ""
  together_api_key: ""
  fireworks_api_key: ""
  xai_api_key: ""
  deepseek_api_key: ""
  orcarouter_api_key: ""
  artificial_analysis_api_key: ""
schema:
  log_level: str
  credential_encryption_key: str
  allow_insecure_dev_key: bool
  database_url: str
  router_cooldown_seconds: int
  openai_api_key: str
  anthropic_api_key: str
  google_api_key: str
  groq_api_key: str
  together_api_key: str
  fireworks_api_key: str
  xai_api_key: str
  deepseek_api_key: str
  orcarouter_api_key: str
  artificial_analysis_api_key: str
